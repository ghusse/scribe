[package]
name = "scribe-platform"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
scribe-core = { path = "../scribe-core" }
tracing = { workspace = true }
cpal = "0.15"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFMachPort", "CFString", "CFNumber", "CFDictionary"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-application-services = { version = "0.3", features = ["AXUIElement", "AXError", "HIServices", "libc"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder", "NSGraphics"] }
dispatch2 = "0.3"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
libc = "0.2"
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
