[package]
name = "scribe-app"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
scribe-core = { path = "../crates/scribe-core" }
scribe-providers = { path = "../crates/scribe-providers" }
scribe-platform = { path = "../crates/scribe-platform" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
# Mock runtime: commands are tested with a real `State` (tauri::test::mock_app).
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "test"] }
