name: Semantic Release

# Continuous delivery from Conventional Commits, with no release PR and no human step (release.config.mjs).
# Each push to main that CI validated is analysed by semantic-release from the last vX.Y.Z tag. When it contains a
# feat, fix or perf commit, semantic-release writes the version into package.json, src-tauri/Cargo.toml and
# Cargo.lock (scribe-app), adds the notes on top of CHANGELOG.md, commits "chore(release): X.Y.Z" to main, tags it
# vX.Y.Z and creates a DRAFT release. The jobs below then build Windows and macOS from that tag into the draft and
# publish it only once both builds succeeded.
# Everything runs in this workflow: a commit or tag pushed with GITHUB_TOKEN triggers no other workflow (no CI run
# for the release commit, no release.yml run for the tag, no new run of this workflow).
# A CI run of main cancelled by a newer push (ci.yml: cancel-in-progress) releases nothing: the green run of the
# newer push releases everything since the last tag.
# Recovery: run this workflow by hand (workflow_dispatch) with the tag of a release left unpublished. It rebuilds both
# platforms into its draft (existing assets are replaced) and publishes it. When semantic-release pushed the tag but
# failed to create the draft, the manual run creates it first (notes taken from CHANGELOG.md at that tag). "Re-run
# failed jobs" only helps when a build or the publish failed: a re-run of the release job finds main moved (release
# commit) and creates nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release to build and publish (vX.Y.Z)"
        required: true
        type: string

# Nothing by default; each job asks for what it needs.
permissions: {}

# Same text as release.yml: appended to the changelog of the published release, and the notes of latest.json.
env:
  RELEASE_BODY: "Windows : installeur NSIS (recommandé) ou MSI, non signés : à la première installation, SmartScreen > « Informations complémentaires » > « Exécuter quand même ». macOS : le .dmg universel (Apple Silicon et Intel), non notarisé : au premier lancement, clic droit sur Scribe > Ouvrir, puis autoriser Scribe dans Réglages Système > Confidentialité et sécurité > Accessibilité. Confidentialité : https://github.com/ghusse/scribe/blob/main/PRIVACY.md"

jobs:
  # Creates the release commit, the tag and the draft release, and nothing else: its outputs drive the builds.
  # Only for a green CI run of a push to main of this repository (never a pull request, even from a fork branch
  # named main), or a manual run.
  # Concurrency: GitHub keeps one pending job per group and cancels the older one. Automatic runs share one group:
  # two of them never release at once, and a pending one replaced by a newer one loses nothing, since every run
  # releases all the commits since the last tag. A manual run never pushes anything, so it gets a group of its own
  # per tag: an automatic run never cancels a pending recovery, and a recovery never cancels a pending release.
  release:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: semantic-release-${{ github.event_name == 'workflow_dispatch' && format('recovery-{0}', inputs.tag) || 'auto' }}
      cancel-in-progress: false
    permissions:
      contents: write # release commit on main, tag, draft release (and listing drafts)
    outputs:
      created: ${{ steps.draft.outputs.created }}
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.draft.outputs.tag }}
      version: ${{ steps.draft.outputs.version }}
    steps:
      # Release exactly the commit CI validated, and only while it is still the head of main. If main moved since,
      # this run stops here: the newer push has its own CI run, which releases its commits and these ones. (Should
      # main move between this check and the push of the release commit, that push is rejected as non-fast-forward
      # and the run fails before any tag or release exists.)
      - name: Main is still the commit CI validated
        id: head
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)
          if [ "$main" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $main, no longer at $HEAD_SHA validated by CI: nothing to release from this run"
          fi

      # Full history and tags: semantic-release reads the commits since the last vX.Y.Z tag. No stored
      # credentials: semantic-release pushes with GITHUB_TOKEN itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.head.outputs.current == 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # semantic-release releases from the branch "main" (GITHUB_REF of a workflow_run event): give the validated
      # commit that local branch name instead of a detached HEAD.
      - name: Local main at the validated commit
        if: ${{ steps.head.outputs.current == 'true' }}
        run: git switch --force-create main

      # semantic-release 25 needs Node ^22.14 or >= 24.10 (its git and changelog plugins ^22.22.2 or >= 24.15).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.head.outputs.current == 'true' }}
        with:
          node-version: 24

      # Bun installs the pinned plugins (bun.lock) and runs scripts/release-version.ts in the prepare step.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.head.outputs.current == 'true' }}
        with:
          bun-version-file: package.json

      - if: ${{ steps.head.outputs.current == 'true' }}
        run: bun install --frozen-lockfile

      # No release when the commits since the last tag hold no feat, fix or perf (nor breaking change): no output.
      # Otherwise writes version=X.Y.Z to the step outputs (release.config.mjs > successCmd).
      - name: semantic-release
        id: semantic
        if: ${{ steps.head.outputs.current == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node node_modules/semantic-release/bin/semantic-release.js

      # The draft release of the new tag, or (manual run) the draft for the given tag. A published release is never
      # rebuilt. Manual run on a tag with no release at all (semantic-release pushed the release commit and the tag,
      # then failed to create the draft): create the draft, named and described as semantic-release would (the
      # tag, and that version's notes from CHANGELOG.md at the tag). Never for a tag that does not exist (the API
      # would create it on main). Start such a run only once the automatic run of that tag has failed: during it,
      # the run could add a second draft next to the one semantic-release is about to create.
      - name: Draft release
        id: draft
        if: ${{ github.event_name == 'workflow_dispatch' || steps.semantic.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('v{0}', steps.semantic.outputs.version) }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the tag must look like vX.Y.Z"
            exit 1
          fi
          # A draft is not reachable through releases/tags/{tag}: look for it in the list.
          id=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' | head -n 1)
          if [ -z "$id" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if gh api "repos/$GH_REPO/releases/tags/$TAG" --silent 2>/dev/null; then
              echo "::error::$TAG is already published"
              exit 1
            fi
            if ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
              echo "::error::no tag $TAG"
              exit 1
            fi
            version="${TAG#v}"
            # The section of this version: from its heading ("## [X.Y.Z](...)" or "## X.Y.Z") to the next one.
            notes=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/CHANGELOG.md?ref=$TAG" |
              awk -v v="$version" '
                /^##? / { if (found) exit; h = $2; sub(/\(.*$/, "", h); gsub(/\[/, "", h); gsub(/\]/, "", h); if (h == v) { found = 1; next } }
                found { print }
              ')
            id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true -f body="$notes" --jq .id)
            echo "::notice::created the missing draft release for $TAG"
          fi
          if [ -z "$id" ]; then
            echo "::error::no draft release for $TAG"
            exit 1
          fi
          {
            echo "created=true"
            echo "id=$id"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

  # The build chain uses one concurrency group per release, never cancelled. A re-run or manual run waiting for its
  # turn is therefore never replaced by later pushes to main (they queue in the release job's group), and two runs
  # of the same release never rewrite its latest.json at once.
  windows:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: release-build-${{ needs.release.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write # upload to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      # The bundles and latest.json take the version from src-tauri/Cargo.toml: it must be the released one.
      - name: Cargo.toml has the released version
        shell: bash
        env:
          EXPECTED: ${{ needs.release.outputs.version }}
        run: |
          version=$(awk -F'"' '{ sub(/\r$/, "") } /^\[/ { p = ($0 == "[package]") } p && /^version *=/ { print $2; exit }' src-tauri/Cargo.toml)
          if [ "${version}" != "${EXPECTED}" ]; then
            echo "::error::release ${EXPECTED} but src-tauri/Cargo.toml says ${version}"
            exit 1
          fi

      # Pinned by SHA, the action no longer reads the toolchain from the ref: name it.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # releaseId: upload into exactly the draft of semantic-release without rewriting its name or body (the changelog),
      # as tagName would. With releaseId, releaseBody only becomes the notes of latest.json.
      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles (createUpdaterArtifacts); the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          releaseId: ${{ needs.release.outputs.id }}
          releaseBody: ${{ env.RELEASE_BODY }}
          # latest.json, read by the installed apps once the release is published, points to the NSIS installer.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # After Windows: both jobs rewrite latest.json, this one adds the macOS entries.
  macos:
    needs: [release, windows]
    runs-on: macos-latest
    timeout-minutes: 60
    concurrency:
      group: release-build-${{ needs.release.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write # upload to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Ad-hoc signed (tauri.conf.json > bundle.macOS.signingIdentity "-"), not notarized: Gatekeeper asks once.
      - name: Build and attach the macOS bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: --target universal-apple-darwin
          releaseId: ${{ needs.release.outputs.id }}
          releaseBody: ${{ env.RELEASE_BODY }}
          uploadUpdaterJson: true

  # Only when both builds succeeded (default `needs` condition): the draft becomes a published release, which the
  # installed apps find through releases/latest/download/latest.json.
  publish:
    needs: [release, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-build-${{ needs.release.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write # edit the release
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .body > notes.md
          # A re-run must not append the installation notes twice.
          if ! grep -qxF "$RELEASE_BODY" notes.md; then
            printf '\n%s\n' "$RELEASE_BODY" >> notes.md
          fi
          # Builds of two releases no longer wait for each other, so they may be published out of order.
          # make_latest=legacy marks as latest the newest release by creation date and version, whatever that order.
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -f name="Scribe $TAG" -F body=@notes.md -F draft=false -f make_latest=legacy > /dev/null
