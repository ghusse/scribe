name: Release

# Pushing a tag vX.Y.Z builds the installers and attaches them to a draft GitHub release, published by hand
# once checked. The tag must match the version in src-tauri/tauri.conf.json.
on:
  push:
    # X.Y.Z only: the MSI bundler rejects pre-release versions such as 0.2.0-beta.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Nothing by default; only the job that creates the release may write.
permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but tauri.conf.json says ${version}"
            exit 1
          fi

      # Pinned by SHA, the action no longer reads the toolchain from the ref: name it.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Unsigned for now: Windows SmartScreen asks for a confirmation on first launch.
      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles (createUpdaterArtifacts); the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: Scribe ${{ github.ref_name }}
          releaseBody: Installeur Windows (NSIS, recommandé) et MSI. Non signés pour l'instant.
          releaseDraft: true
          # latest.json, read by the installed apps once the release is published, points to the NSIS installer.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
