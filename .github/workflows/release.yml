name: Release

# Manual fallback for release-please.yml (which builds and publishes releases on its own): pushing a tag vX.Y.Z
# builds the installers and attaches them to a draft GitHub release, published by hand once checked. The tag must
# match the version in src-tauri/Cargo.toml (the app version: tauri.conf.json has none).
on:
  push:
    # X.Y.Z only: the MSI bundler rejects pre-release versions such as 0.2.0-beta.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Nothing by default; only the jobs that upload to the release may write.
permissions: {}

# Both jobs set it: tauri-action v1 rewrites the name and body of an existing release.
env:
  RELEASE_BODY: "Windows : installeur NSIS (recommandé) ou MSI, non signés : à la première installation, SmartScreen > « Informations complémentaires » > « Exécuter quand même ». macOS : le .dmg universel (Apple Silicon et Intel), non notarisé : au premier lancement, clic droit sur Scribe > Ouvrir, puis autoriser Scribe dans Réglages Système > Confidentialité et sécurité > Accessibilité. Confidentialité : https://github.com/ghusse/scribe/blob/main/PRIVACY.md"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(awk -F'"' '{ sub(/\r$/, "") } /^\[/ { p = ($0 == "[package]") } p && /^version *=/ { print $2; exit }' src-tauri/Cargo.toml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but src-tauri/Cargo.toml says ${version}"
            exit 1
          fi

      # Pinned by SHA, the action no longer reads the toolchain from the ref: name it.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Unsigned for now: Windows SmartScreen asks for a confirmation on first launch.
      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles (createUpdaterArtifacts); the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: Scribe ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          # latest.json, read by the installed apps once the release is published, points to the NSIS installer.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # After the Windows job: it creates the draft release, this one adds the macOS bundles and its entries in latest.json.
  macos:
    needs: windows
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Ad-hoc signed (tauri.conf.json > bundle.macOS.signingIdentity "-"), not notarized: Gatekeeper asks once.
      - name: Build and attach the macOS bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Scribe ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          uploadUpdaterJson: true
