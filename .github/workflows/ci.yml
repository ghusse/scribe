name: CI

# Pushes to main, plus every pull request: a PR branch is not built twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable + llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      # Also produces dist/, which the Tauri crate embeds at compile time.
      - name: Build UI
        id: build
        run: npm run build

      # Two independent gates: a failing UI gate must not hide the Rust one (it runs whenever the build passed).
      - name: Coverage gate UI (>= 95 % lines, TypeScript and Svelte each)
        run: npm run coverage:ui

      - name: Coverage gate Rust (>= 95 % lines)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run coverage:rust
