name: CI

# Pushes to main, plus every pull request: a PR branch is not built twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust stable + llvm-tools-preview
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned by SHA, the action no longer reads the toolchain from the ref: name it.
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-llvm-cov

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Type check (svelte-check)
        run: bun run check

      # Also produces dist/, which the Tauri crate embeds at compile time.
      - name: Build UI
        id: build
        run: bun run build

      # Two independent gates: a failing UI gate must not hide the Rust one (it runs whenever the build passed).
      - name: Coverage gate UI (>= 95 % lines, TypeScript and Svelte each)
        run: bun run coverage:ui

      - name: Coverage gate Rust (>= 95 % lines)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run coverage:rust

  # The macOS integration (crates/scribe-platform/src/macos) only compiles on macOS: build it and run the tests there.
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # dist/ is embedded by the Tauri crate at compile time.
      - run: bun run build

      - run: cargo test --workspace
